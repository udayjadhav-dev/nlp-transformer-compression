<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TinyML Sentiment Analyzer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: #ffffff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        h1 {
            color: #1f3c4d;
            font-size: 28px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .subtitle {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        label {
            text-align: left;
            font-size: 16px;
            font-weight: 600;
            color: #2c3e50;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            resize: none;
            transition: all 0.3s ease;
            color: #334155;
        }

        textarea:focus {
            border-color: #3498db;
            outline: none;
            box-shadow: 0 0 10px rgba(52, 152, 219, 0.2);
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .result-box {
            margin-top: 30px;
            padding: 20px;
            border-radius: 12px;
            font-size: 20px;
            font-weight: 700;
            background: #f8fafc;
            border: 2px solid #cbd5e1;
            color: #1e293b;
        }

        .metrics {
            margin-top: 10px;
            font-size: 14px;
            font-weight: 500;
            color: #64748b;
        }

        .error {
            color: #e74c3c;
            font-size: 14px;
            text-align: left;
            margin-top: -15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>TinyML Sentiment Analyzer</h1>
    <div class="subtitle">Optimized INT8 Transformer Engine</div>
    
    <form method="POST" action="/">
        <label for="review">Enter Text Review:</label>
        <textarea name="review" id="review" placeholder="Type your text or movie review here..." required>{{ review }}</textarea>
        
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
        
        <button type="submit">Analyze Live Sentiment</button>
    </form>

    {% if sentiment %}
        <div class="result-box">
            Predicted Sentiment: {{ sentiment }}
            <div class="metrics">Inference Engine Confidence: {{ confidence }}</div>
        </div>
    {% endif %}
</div>

</body>
</html>
